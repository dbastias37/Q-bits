<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tablet 2.0 · Prueba de resoluciones</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1b1a;color:#d5eadc;font:14px system-ui}header{padding:12px 20px;display:flex;gap:12px;align-items:center;position:sticky;top:0;background:#142d28;z-index:3}button{padding:8px 12px;background:#284b3e;color:#c9f0d8;border:1px solid #739d83;border-radius:5px;cursor:pointer}output{margin-left:auto}main{padding:20px;display:flex;justify-content:center;min-width:max-content}iframe{border:1px solid #739d83;background:#c2cbc8;width:390px;height:844px;flex:none}a{color:#c9f0d8}</style></head><body><header><strong>Viewport de prueba</strong><button data-size="390,844">390 × 844</button><button data-size="768,1024">768 × 1024</button><button data-size="1024,768">1024 × 768</button><button data-size="1366,900">1366 × 900</button><output id="viewport">390 × 844</output><a href="../">Volver a demo</a></header><main><iframe id="preview" title="Tableta en resolución de prueba" src="../"></iframe></main><script>document.addEventListener('click',event=>{const b=event.target.closest('[data-size]');if(!b)return;const [w,h]=b.dataset.size.split(',');const f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px';document.querySelector('output').textContent=w+' × '+h;});</script></body></html>
