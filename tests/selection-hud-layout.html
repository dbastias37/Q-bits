<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q-bits · selección de estructuras</title><link rel="stylesheet" href="../assets/css/selection-hud.css">
<p>Mantén Tab para ver la selección. Usa las flechas y Enter para elegir una estructura.</p>
<section id="selection-hud" hidden></section><script src="../assets/js/selection-hud.js"></script><script>
let entries=Array.from({length:12},(_,i)=>({id:i,name:'Montaje '+(i+1),count:i+1}));
const hud=QBitsSelectionHUD.create({root:document.querySelector('#selection-hud'),onSelect(id,{toggle}){
 entries=entries.filter(item=>toggle?item.id!==id:item.id===id);hud.update(entries);
}});
hud.update(entries);hud.setHint('← → para elegir · Enter para aislar');
window.addEventListener('keydown',event=>{
 if(!['Tab','ArrowLeft','ArrowRight','Enter'].includes(event.code))return;
 event.preventDefault();
 if(event.code==='Tab')hud.setInteractive(true);
 else if(event.code==='Enter')hud.activateFocused({toggle:event.ctrlKey});
 else hud.stepFocus(event.code==='ArrowLeft'?-1:1);
});
window.addEventListener('keyup',event=>{if(event.code==='Tab')hud.setInteractive(false);});
</script></html>
