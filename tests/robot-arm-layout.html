<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Q-bits · prueba visual del brazo</title><style>body{margin:0;background:linear-gradient(145deg,#f1f6f1,#d2dfd4);font:14px system-ui}.fixture-note{position:fixed;left:20px;top:20px;max-width:min(430px,45vw);color:#688271;line-height:1.6;font-size:12px}</style></head><body><p class="fixture-note">Vista de interfaz con datos de prueba. Carga el marcado, estilos y controlador reales; no simula el brazo ni sus físicas.</p><script>
(async()=>{
 const source=new DOMParser().parseFromString(await (await fetch('index.html')).text(),'text/html');for(const node of source.head.querySelectorAll('style,link[rel="stylesheet"]'))document.head.append(node.cloneNode(true));
 const panel=source.querySelector('#panel').cloneNode(true);document.body.append(panel);panel.hidden=false;for(const page of panel.querySelectorAll('[role="tabpanel"]'))page.hidden=true;panel.querySelector('#page-mechanisms').hidden=false;
 await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='assets/js/robot-arm-panel.js';script.onload=resolve;script.onerror=reject;document.head.append(script);});
 const state={available:true,selectedLabel:'Brazo Q-bits · base 4 × 3',canConvert:false,canRegister:false,targets:[{id:2,label:'Q-bit calipso · #2'},{id:3,label:'Cubo de carga · #3'}],gripper:{id:31,name:'Agarre',mode:'color',color:'#00ff99',capacity:4,targetId:2},arm:{name:'Brazo Q-bits',status:'Preparado · posiciones A y B guardadas',running:false,phase:'detect',pickReady:true,placeReady:true,repeat:true,joints:[{name:'Base',angle:0},{name:'Hombro',angle:30},{name:'Codo',angle:-15},{name:'Muñeca',angle:0}],load:0,capacity:4,energy:240,cycles:3,efficiency:100}};
 const ui=QBitsRobotArmPanel.create({snapshot:()=>state,action:(type,payload)=>{if(type==='filter')Object.assign(state.gripper,payload);if(type==='repeat')state.arm.repeat=payload.value;if(type==='jog')state.arm.joints[payload.joint].angle+=payload.degrees;if(type==='start'){state.arm.running=true;state.arm.phase='move';state.arm.status='Llevando el objeto a B';}if(type==='stop'){state.arm.running=false;state.arm.status='Detenido';}return {ok:true,message:'Acción de prueba aplicada'};}});ui.refresh();
 const params=new URLSearchParams(location.search);if(params.has('step')){const step=document.querySelector('#arm-jog-step');step.value=params.get('step');step.dispatchEvent(new Event('change'));}if(params.get('view')==='library'){panel.querySelector('#page-mechanisms').hidden=true;panel.querySelector('#page-alpha').hidden=false;document.querySelector('#saved-shape-list').innerHTML='<div><button>Lingote · 12 unidades</button><button aria-label="Eliminar lingote">×</button></div>';document.querySelector('#saved-library-mechanisms').innerHTML='<div><button>Brazo Q-bits · blueprint</button></div><div><button>Vehículo · 4 rotores</button><button aria-label="Eliminar vehículo">×</button></div>';ui.category('mechanisms');}
})().catch(error=>{document.querySelector('.fixture-note').textContent=error.message;console.error(error);});
</script></body></html>
