<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Q-bits · verificación del taller</title>
<style>
.fixture-room{position:fixed;inset:0;background:linear-gradient(150deg,#f2f5f2 0 42%,#cdd9d0 42.2% 42.5%,#e5ede7 42.7% 66%,#f5faf6 66.2%)}
.fixture-desk{position:absolute;left:18%;top:46%;width:58%;height:8%;background:#5c6864;transform:skewY(-7deg);box-shadow:20px 40px 55px #354d4238}
.fixture-open{position:fixed;left:16px;bottom:16px;z-index:120;padding:8px 15px;border:1px solid #92a99b;border-radius:12px;background:#f2f9f4;color:#45624f;font:12px system-ui}
</style></head><body><div class="fixture-room"><div class="fixture-desk"></div></div><button class="fixture-open" id="fixture-open">Abrir taller</button>
<script>
(async()=>{
 const response=await fetch('index.html');if(!response.ok)throw Error('No se pudo cargar la interfaz real.');
 const source=new DOMParser().parseFromString(await response.text(),'text/html');for(const node of source.head.querySelectorAll('style,link[rel="stylesheet"]'))document.head.append(node.cloneNode(true));
 document.body.append(source.querySelector('#workshop-screen').cloneNode(true));
 await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='assets/js/workshop-panel.js?v=20261116-battery-liquid-1';script.onload=resolve;script.onerror=reject;document.head.append(script);});
 let made=false;const tabs=new URLSearchParams(location.search),count=tabs.get('tab')==='bodies'?8:2;
 const snapshot=()=>({credits:24,target:{id:1,count,dimensions:{x:count,y:1,z:1},summary:'Estructura de prueba · '+count+' piezas sobre la mesa'}});
 function inspect(draft){
  if(draft.tab==='bodies'){const d=draft.dimensions,needed=d.x*d.y*d.z;return {title:'Cuerpo de '+d.x+' × '+d.z+' × '+d.y,description:'Largo × ancho × alto',intro:'Redistribuye los cubos de la mesa. La cantidad de piezas se conserva.',fields:[['x','Largo'],['z','Ancho'],['y','Alto']].map(([axis,label])=>({id:'dimension-'+axis,label,value:d[axis],min:1,max:16})),preview:{kind:'body',size:[d.x,d.y,d.z],caption:'Cada división corresponde a un cubo existente'},facts:[['En la mesa',count],['Necesarios',needed],['Resultado',d.x+' × '+d.z+' × '+d.y]],allowed:needed===count,error:needed===count?'':'Necesitas exactamente '+count+' cubos para conservar la estructura.',applyLabel:'Formar cuerpo',targetId:1,action:{kind:'body'}};}
  if(draft.tab==='upgrades'){const research=draft.mode==='research';return {title:research?'Sensor de contacto':'Estructura ligera II',description:research?'Desbloquea una opción del taller':'Q-bit de prueba',intro:research?'Investiga una vez. Después puedes aplicar esa mejora sin volver a pagar.':'Elige una adaptación y revisa el resultado antes de aplicarla.',modes:[{id:'adapt',label:'Adaptaciones'},{id:'research',label:'Investigaciones'}],options:(research?['Sensor de contacto','Reserva interna II','Reserva interna III','Estructura ligera II','Estructura ligera III','Movimiento II','Movimiento III']:['Sensor de contacto','Reserva interna','Estructura ligera','Movimiento','Restaurar pieza']).map((title,i)=>({id:(research?'research:':'upgrade:')+['sensor','battery','lightweight','movement','restore'][i%5],title,subtitle:research?8+i*4+' créditos':'Adaptación de la pieza seleccionada'})),fields:research?[]:[{id:'tier',label:'Nivel de adaptación',value:draft.tier,options:[[1,'I · Original'],[2,'II · Mejorado'],[3,'III · Avanzado']]}],preview:{kind:research?'research':'piece',size:[1,1,1],sensor:true},facts:research?[['Costo','8 créditos'],['Disponibles',24],['Estado','Disponible']]:[['Peso','0.75 u'],['Batería',80],['Materia','1 u conservada']],allowed:true,applyLabel:research?'Investigar · 8 créditos':'Aplicar adaptación',action:{kind:research?'research':'upgrade'},targetId:1};}
  const n=Number(draft.choice.split(':')[1])||count;return {title:'Batería '+['','I','II','III'][n],description:'Carcasa transparente · reserva externa',intro:'Convierte cubos unidos en una batería externa. Las tres versiones están disponibles.',options:[1,2,3].map(i=>({id:'battery:'+i,title:'Batería '+['','I','II','III'][i],subtitle:i+' cubo'+(i===1?'':'s')+' · capacidad ×'+i})),preview:{kind:'battery',size:[n,1,1],energy:.63,caption:'El nivel verde representa la carga que se conserva'},facts:[['Cubos',n],['Capacidad',n*120],['Carga inicial','63 %']],allowed:n===count&&!made,error:n!==count?'Coloca exactamente '+n+' cubos unidos sobre la mesa.':'',note:made?'Batería preparada. El resultado permanece sobre la mesa.':'',applyLabel:made?'Batería preparada':'Crear batería '+['','I','II','III'][n],help:'Después: acóplala con Shift, actívala y arranca los rotores. Para recargar, apágala y apoya su carcasa en el piso.',targetId:1,action:{kind:'battery'}};
 }
 const panel=QBitsWorkshopPanel.create({snapshot,inspect,apply:draft=>{if(draft.tab==='batteries')made=true;return {ok:true,message:'Aplicado · el resultado queda sobre la mesa.'};},onClose:()=>panel.close()});
 document.querySelector('#fixture-open').onclick=()=>panel.open(tabs.get('tab')||'batteries');document.addEventListener('keydown',event=>{if(['Escape','KeyE','KeyP'].includes(event.code))panel.close();});panel.open(tabs.get('tab')||'batteries');if(tabs.get('mode'))panel.setMode(tabs.get('mode'));
})().catch(error=>{document.querySelector('#fixture-open').textContent=error.message;console.error(error);});
</script></body></html>
